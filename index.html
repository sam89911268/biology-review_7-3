<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七下第三次段考生物複習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 中性與背景 */
      --bg: #eef3f3;
      --panel: #ffffff;
      --panel-soft: #f6f9f9;
      --ink: #16242f;
      --muted: #5a6b78;
      --line: #e3eaee;
      --line-strong: #cfdade;

      /* 主色：teal=生物/行動，indigo=範圍/強調 */
      --teal: #0f9d8f;
      --teal-dark: #0b7d72;
      --teal-soft: #e6f6f3;
      --indigo: #5566e6;
      --indigo-dark: #3f4fd0;
      --indigo-soft: #eef0fe;

      /* 狀態 */
      --ok: #0f9d63;
      --ok-soft: #e9faf1;
      --bad: #e1466b;
      --bad-soft: #fdedf1;
      --warn: #d77a16;

      /* 形狀與陰影 */
      --r-sm: 12px;
      --r: 16px;
      --r-lg: 22px;
      --shadow-card: 0 22px 60px -28px rgba(16, 50, 60, 0.45), 0 2px 8px -2px rgba(16, 50, 60, 0.08);
      --shadow-pop: 0 14px 30px -12px rgba(15, 157, 143, 0.5);
      --ring: 0 0 0 3px rgba(85, 102, 230, 0.32);

      --num: "Fredoka", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      --body: "Noto Sans TC", "Microsoft JhengHei", system-ui, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(38rem 30rem at 8% -6%, rgba(15, 157, 143, 0.18), transparent 70%),
        radial-gradient(34rem 28rem at 102% 0%, rgba(85, 102, 230, 0.16), transparent 70%),
        radial-gradient(40rem 40rem at 50% 120%, rgba(15, 157, 143, 0.08), transparent 70%),
        var(--bg);
    }

    main {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(28px, 5vw, 52px) 0 40px;
    }

    /* ---------- 標頭 ---------- */
    .header { margin-bottom: 22px; }

    .header h1 {
      margin: 0 0 10px;
      font-family: var(--num);
      font-weight: 700;
      letter-spacing: -0.01em;
      font-size: clamp(1.9rem, 5.2vw, 3rem);
      line-height: 1.12;
      color: var(--ink);
    }

    .header h1::before {
      content: "🧬";
      margin-right: 0.4rem;
      -webkit-text-fill-color: initial;
    }

    .subtitle {
      margin: 0;
      max-width: 46ch;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
    }

    .creator {
      margin-top: 26px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
    }
    .creator a { color: var(--indigo); text-decoration: none; font-weight: 700; }
    .creator a:hover,
    .creator a:focus-visible { color: var(--indigo-dark); text-decoration: underline; outline: none; }

    /* ---------- 卡片 ---------- */
    .quiz-card {
      position: relative;
      padding: clamp(20px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
        var(--panel);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .quiz-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--teal), var(--indigo));
    }

    /* ---------- 開始畫面 ---------- */
    .start-screen { display: grid; gap: 20px; }
    .start-screen.hidden,
    .quiz-screen.hidden { display: none; }

    .start-title {
      margin: 0;
      font-family: var(--num);
      font-weight: 600;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      line-height: 1.25;
    }
    .start-note {
      margin: -8px 0 0;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.6;
    }

    .selection-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .summary-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      color: var(--ink);
      background: var(--panel-soft);
      font-weight: 600;
      line-height: 1.4;
    }
    #topicSummary::before { content: "🧭"; font-size: 1.05rem; }
    #poolSummary::before  { content: "🎯"; font-size: 1.05rem; }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 -6px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.95rem;
    }
    .option-label::before {
      content: "";
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--teal), var(--indigo));
    }

    .count-options,
    .topic-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .count-option {
      position: relative;
      min-height: 56px;
      border: 1.5px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 12px 14px;
      color: var(--ink);
      background: #fff;
      font-family: var(--num);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }
    .topic-option { font-family: var(--body); font-weight: 700; }

    .count-option:hover,
    .count-option:focus-visible {
      border-color: var(--indigo);
      background: var(--indigo-soft);
      transform: translateY(-2px);
      outline: none;
    }
    .topic-option:hover,
    .topic-option:focus-visible {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .count-option.selected {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
      box-shadow: 0 12px 24px -10px rgba(85, 102, 230, 0.7);
      transform: translateY(-1px);
    }
    .topic-option.selected {
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      box-shadow: 0 12px 24px -10px rgba(15, 157, 143, 0.7);
    }
    .count-option.selected::after,
    .topic-option.selected::after {
      content: "✓";
      position: absolute;
      top: 6px;
      right: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .start-message {
      min-height: 22px;
      color: var(--bad);
      font-weight: 700;
    }
    .start-message:not(:empty)::before { content: "⚠ "; }

    .start-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding-top: 2px;
    }
    .start-button {
      min-width: 168px;
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      box-shadow: var(--shadow-pop);
    }
    .start-button:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--teal-dark), #0a6c63);
    }

    /* ---------- 作答頂部 ---------- */
    .top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      color: var(--muted);
      font-weight: 600;
    }
    .progress { display: flex; align-items: center; gap: 12px; }
    .number {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, var(--teal), var(--indigo));
      font-family: var(--num);
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 8px 18px -8px rgba(15, 157, 143, 0.8);
    }
    #progressText { font-weight: 600; }
    #scoreText {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      font-family: var(--num);
      font-weight: 600;
      color: var(--ink);
    }
    #scoreText::before { content: "⭐"; }

    .progress-track {
      overflow: hidden;
      height: 12px;
      margin: 0 0 24px;
      border-radius: 999px;
      background: #dfe8ea;
      box-shadow: inset 0 1px 2px rgba(16, 50, 60, 0.12);
    }
    .progress-bar {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--indigo));
      background-size: 200% 100%;
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ---------- 題目與選項 ---------- */
    .question-text {
      margin: 0 0 22px;
      font-size: clamp(1.3rem, 3.6vw, 1.9rem);
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.005em;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .choice {
      position: relative;
      min-height: 60px;
      border: 1.5px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 14px 18px 14px 18px;
      color: var(--ink);
      background: #fff;
      font-size: 1.08rem;
      font-weight: 600;
      text-align: left;
      line-height: 1.45;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }
    .choice:hover:not(:disabled),
    .choice:focus-visible {
      border-color: var(--indigo);
      background: var(--indigo-soft);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -16px rgba(85, 102, 230, 0.9);
      outline: none;
    }
    .choice:disabled { cursor: default; opacity: 0.92; transform: none; }

    .choice.correct {
      border-color: var(--ok);
      color: #0a7a4c;
      background: var(--ok-soft);
    }
    .choice.correct::after {
      content: "✓";
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      font-weight: 800;
      color: var(--ok);
    }
    .choice.wrong {
      border-color: var(--bad);
      color: #b3325a;
      background: var(--bad-soft);
    }
    .choice.wrong::after {
      content: "✕";
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      font-weight: 800;
      color: var(--bad);
    }

    /* ---------- 回饋 ---------- */
    .feedback {
      min-height: 26px;
      border-radius: var(--r-sm);
      padding: 13px 15px;
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      font-weight: 600;
      line-height: 1.5;
    }
    .feedback.correct {
      color: #0a7a4c;
      background: var(--ok-soft);
      border-color: rgba(15, 157, 99, 0.4);
    }
    .feedback.correct::before { content: "🎉 "; }
    .feedback.wrong {
      color: #b3325a;
      background: var(--bad-soft);
      border-color: rgba(225, 70, 107, 0.4);
    }
    .feedback.wrong::before { content: "💡 "; }
    .feedback .explanation {
      display: block;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed currentColor;
      color: var(--ink);
      font-weight: 500;
      line-height: 1.6;
      opacity: 0.92;
    }

    .kbd-hint {
      display: none;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 500;
    }
    .kbd-hint kbd {
      display: inline-block;
      min-width: 1.4em;
      padding: 1px 6px;
      margin: 0 1px;
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #fff;
      font-family: var(--num);
      font-size: 0.82rem;
      text-align: center;
      color: var(--ink);
    }
    @media (hover: hover) and (pointer: fine) {
      .kbd-hint { display: block; }
    }

    /* ---------- 動作按鈕 ---------- */
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: var(--r-sm);
      padding: 0 22px;
      color: #fff;
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
      font-family: var(--body);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, opacity 140ms ease;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 22px -12px rgba(85, 102, 230, 0.8); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { cursor: default; opacity: 0.5; }
    button.secondary {
      color: var(--indigo-dark);
      background: var(--indigo-soft);
    }
    button.secondary:hover:not(:disabled) {
      background: #e0e4fd;
      box-shadow: 0 10px 20px -14px rgba(85, 102, 230, 0.7);
    }
    :focus-visible { outline: none; box-shadow: var(--ring); }
    button:focus-visible { box-shadow: var(--ring); }

    /* ---------- 結果 ---------- */
    .result {
      display: none;
      margin-top: 22px;
      padding: 22px;
      border: 1px solid rgba(15, 157, 143, 0.3);
      border-radius: var(--r);
      background: linear-gradient(135deg, var(--teal-soft), #fff);
      font-family: var(--num);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--ink);
    }
    .result.show { display: block; animation: rise 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .result::before { content: "🏁 "; }

    /* 完成狀態：隱藏作答殘留元素，讓結果頁聚焦 */
    .quiz-screen.is-finished .question-text,
    .quiz-screen.is-finished #choices,
    .quiz-screen.is-finished #feedback,
    .quiz-screen.is-finished .kbd-hint,
    .quiz-screen.is-finished .progress-track {
      display: none;
    }

    /* ---------- 成績卡 ---------- */
    .score-card {
      display: none;
      margin-top: 22px;
      padding: clamp(22px, 4vw, 30px);
      border-radius: var(--r);
      border: 1px solid var(--line);
      background:
        radial-gradient(22rem 14rem at 50% -30%, var(--tier-soft, var(--teal-soft)), transparent 70%),
        #fff;
      text-align: center;
    }
    .score-card.show { display: block; animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    .score-ring {
      --pct: 0;
      position: relative;
      width: 168px;
      height: 168px;
      margin: 4px auto 16px;
      border-radius: 50%;
      background:
        conic-gradient(var(--tier, var(--teal)) calc(var(--pct) * 1%), #e6edef 0);
      transition: background 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .score-ring::after {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 2px 10px rgba(16, 50, 60, 0.08);
    }
    .score-ring__inner {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 0;
      z-index: 1;
    }
    .score-ring__value {
      font-family: var(--num);
      font-weight: 700;
      font-size: 2.9rem;
      line-height: 1;
      color: var(--tier, var(--ink));
    }
    .score-ring__total { font-family: var(--num); font-weight: 600; font-size: 0.9rem; color: var(--muted); margin-top: 2px; }

    .score-tier {
      font-family: var(--num);
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--tier, var(--ink));
      margin: 0 0 4px;
    }
    .score-detail { margin: 0; color: var(--muted); font-weight: 600; }

    .score-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
    .score-actions .again-button {
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      box-shadow: var(--shadow-pop);
    }
    .score-actions .again-button::before { content: "🔄 "; }

    /* 成績分級配色（以 inline style 設 --tier / --tier-soft，這裡備援） */
    .score-card[data-tier="gold"]   { --tier: #e0a306; --tier-soft: #fdf3d8; }
    .score-card[data-tier="green"]  { --tier: #0f9d63; --tier-soft: var(--ok-soft); }
    .score-card[data-tier="teal"]   { --tier: var(--teal); --tier-soft: var(--teal-soft); }
    .score-card[data-tier="indigo"] { --tier: var(--indigo); --tier-soft: var(--indigo-soft); }
    .score-card[data-tier="rose"]   { --tier: var(--bad); --tier-soft: var(--bad-soft); }

    /* ---------- 答錯震動 ---------- */
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    .choice.shake { animation: shake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

    /* ---------- 回到頂部 ---------- */
    .to-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 48px;
      height: 48px;
      min-height: 48px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--indigo), var(--indigo-dark));
      box-shadow: 0 12px 26px -10px rgba(85, 102, 230, 0.8);
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 200ms ease, transform 200ms ease, visibility 200ms;
      z-index: 40;
    }
    .to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }

    /* ---------- 彩帶 ---------- */
    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 60;
    }
    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      will-change: transform, opacity;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(102vh) rotate(720deg); opacity: 0.9; }
    }

    /* ---------- 複習 / 錯題集 ---------- */
    .review { display: none; margin-top: 18px; }
    .review.show { display: block; animation: rise 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }

    .review-section {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px;
      background: #fff;
    }
    .review-section h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .review-section h3::before { content: "📌"; }

    .review-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .review-item {
      border-radius: var(--r-sm);
      padding: 14px;
      background: var(--panel-soft);
      color: var(--muted);
      font-weight: 600;
      border-left: 4px solid var(--line-strong);
    }
    .review-item strong {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
    }
    .review-item.correct { background: var(--ok-soft); border-left-color: var(--ok); }
    .review-item.wrong { background: var(--bad-soft); border-left-color: var(--bad); }

    .review-detail,
    .review-explanation { display: block; line-height: 1.6; }

    .review-options { display: grid; gap: 7px; margin: 10px 0 0; padding: 0; list-style: none; }
    .review-option {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.45;
    }
    .review-option.selected { border-color: var(--bad); color: #b3325a; background: var(--bad-soft); font-weight: 600; }
    .review-option.correct { border-color: var(--ok); color: #0a7a4c; background: var(--ok-soft); font-weight: 600; }

    .review-explanation {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line-strong);
      color: var(--ink);
      font-weight: 500;
      opacity: 0.92;
    }
    .empty-note { margin: 0; color: var(--muted); font-weight: 600; }
    .empty-note::before { content: "🌟 "; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
      .confetti-layer { display: none !important; }
    }

    /* ---------- 響應式 ---------- */
    @media (max-width: 620px) {
      main { width: min(100% - 22px, 760px); }
      .selection-summary { grid-template-columns: 1fr; }
      .choices { grid-template-columns: 1fr; }
      .count-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topic-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .actions button { flex: 1 1 auto; }
      #scoreText { order: 3; }
    }
  </style>
</head>
<body>
  <main>
    <section class="header" aria-labelledby="title">
      <h1 id="title">七下第三次段考生物複習</h1>
      <p class="subtitle">一次顯示一題，選出正確答案後再進入下一題，完成後可查看錯題集。</p>
    </section>

    <section class="quiz-card" aria-live="polite">
      <div class="start-screen" id="startScreen">
        <h2 class="start-title">選擇本次作答的範圍及題數</h2>
        <p class="start-note">系統會從完整題庫中隨機抽題，並隨機安排作答順序。</p>
        <div class="selection-summary">
          <div class="summary-pill" id="topicSummary">尚未選擇範圍</div>
          <div class="summary-pill" id="poolSummary">可抽題數：0 題</div>
        </div>
        <p class="option-label">選擇範圍，可複選</p>
        <div class="topic-options" id="topicOptions">
          <button class="count-option topic-option" type="button" data-topic="植物界">植物界</button>
          <button class="count-option topic-option" type="button" data-topic="動物界">動物界</button>
          <button class="count-option topic-option" type="button" data-topic="生態系">生態系</button>
          <button class="count-option topic-option" type="button" data-topic="人類與環境">人類與環境</button>
        </div>
        <p class="option-label">選擇題數</p>
        <div class="count-options" id="countOptions">
          <button class="count-option" type="button" data-count="5">5 題</button>
          <button class="count-option" type="button" data-count="10">10 題</button>
          <button class="count-option" type="button" data-count="20">20 題</button>
          <button class="count-option" type="button" data-count="25">25 題</button>
          <button class="count-option" type="button" data-count="50">50 題</button>
          <button class="count-option" type="button" data-count="100">100 題</button>
        </div>
        <div class="start-actions">
          <button class="start-button" type="button" id="startButton" disabled>開始作答</button>
          <button class="secondary" type="button" id="clearButton">清除選擇</button>
        </div>
        <div class="start-message" id="startMessage" aria-live="polite"></div>
      </div>

      <div class="quiz-screen hidden" id="quizScreen">
        <div class="top-row">
          <div class="progress">
            <span class="number" id="questionNumber">1</span>
            <span id="progressText">第 1 / 4 題</span>
          </div>
          <span id="scoreText">目前得分：0 / 100</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span class="progress-bar" id="progressBar"></span>
        </div>

        <h2 class="question-text" id="questionText"></h2>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback">請選擇一個答案。</div>
        <p class="kbd-hint" aria-hidden="true">小提示：按 <kbd>1</kbd>–<kbd>4</kbd> 選答案，答完按 <kbd>Enter</kbd> 進入下一題。</p>

        <div class="actions">
          <button type="button" id="nextButton" disabled>下一題</button>
          <button class="secondary" type="button" id="finishButton">提前結束</button>
          <button class="secondary" type="button" id="restartButton">重新選擇題數</button>
        </div>

        <div class="result" id="result"></div>
        <div class="score-card" id="scoreCard" data-tier="teal" aria-live="polite">
          <div class="score-ring" id="scoreRing">
            <div class="score-ring__inner">
              <span class="score-ring__value" id="scoreRingValue">0</span>
              <span class="score-ring__total">／ 100 分</span>
            </div>
          </div>
          <p class="score-tier" id="scoreTier">練習完成</p>
          <p class="score-detail" id="scoreDetail">答對 0／0 題</p>
          <div class="score-actions">
            <button type="button" class="again-button" id="againButton">再來一輪</button>
          </div>
        </div>
        <div class="review" id="review">
          <section class="review-section" aria-labelledby="wrongTitle">
            <h3 id="wrongTitle">錯題集</h3>
            <ul class="review-list" id="wrongList"></ul>
          </section>
        </div>
      </div>
    </section>

    <footer class="creator">
      Instagram：
      <a href="https://www.instagram.com/sam89911268/" target="_blank" rel="noopener noreferrer">@sam89911268</a>
    </footer>
  </main>

  <button type="button" class="to-top" id="toTop" aria-label="回到頂部" title="回到頂部">↑</button>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <script src="biology-plant-questions.js"></script>
  <script src="biology-animal-questions.js"></script>
  <script src="biology-ecosystem-questions.js"></script>
  <script src="biology-human-environment-questions.js"></script>
  <script src="biology-review-questions.js"></script>
  <script>
    const questionBank = window.quizQuestions || [];
    let questions = [];

    const startScreen = document.querySelector("#startScreen");
    const quizScreen = document.querySelector("#quizScreen");
    const topicOptions = document.querySelector("#topicOptions");
    const countOptions = document.querySelector("#countOptions");
    const topicSummary = document.querySelector("#topicSummary");
    const poolSummary = document.querySelector("#poolSummary");
    const startButton = document.querySelector("#startButton");
    const clearButton = document.querySelector("#clearButton");
    const startMessage = document.querySelector("#startMessage");
    const questionNumber = document.querySelector("#questionNumber");
    const progressText = document.querySelector("#progressText");
    const scoreText = document.querySelector("#scoreText");
    const progressBar = document.querySelector("#progressBar");
    const questionText = document.querySelector("#questionText");
    const choices = document.querySelector("#choices");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#nextButton");
    const finishButton = document.querySelector("#finishButton");
    const restartButton = document.querySelector("#restartButton");
    const result = document.querySelector("#result");
    const review = document.querySelector("#review");
    const wrongList = document.querySelector("#wrongList");
    const scoreCard = document.querySelector("#scoreCard");
    const scoreRing = document.querySelector("#scoreRing");
    const scoreRingValue = document.querySelector("#scoreRingValue");
    const scoreTier = document.querySelector("#scoreTier");
    const scoreDetail = document.querySelector("#scoreDetail");
    const againButton = document.querySelector("#againButton");
    const toTop = document.querySelector("#toTop");
    const confettiLayer = document.querySelector("#confettiLayer");

    let currentIndex = 0;
    let score = 0;
    let hasAnswered = false;
    let answers = [];
    let selectedQuestionCount = null;

    function shuffle(items) {
      const shuffled = [...items];

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }

      return shuffled;
    }

    function randomizeChoices(question) {
      const labels = ["A", "B", "C", "D"];
      let shuffledChoices = shuffle(question.choices);
      const keptOriginalOrder = shuffledChoices.every((choice, index) => choice.key === question.choices[index].key);

      if (keptOriginalOrder && shuffledChoices.length > 1) {
        shuffledChoices = [...shuffledChoices.slice(1), shuffledChoices[0]];
      }

      const choices = shuffledChoices.map((choice, index) => ({
        key: labels[index],
        text: choice.text,
        originalKey: choice.key
      }));
      const correctChoice = choices.find((choice) => choice.originalKey === question.answer);

      return {
        ...question,
        choices,
        answer: correctChoice ? correctChoice.key : question.answer
      };
    }

    function getSelectedTopics() {
      return Array.from(document.querySelectorAll("[data-topic].selected"))
        .map((button) => button.dataset.topic);
    }

    function getAvailableQuestions() {
      const selectedTopics = getSelectedTopics();
      return questionBank.filter((question) => selectedTopics.includes(question.category));
    }

    function updateStartControls() {
      const selectedTopics = getSelectedTopics();
      const availableQuestions = getAvailableQuestions();
      const activeCount = selectedQuestionCount ? Math.min(selectedQuestionCount, availableQuestions.length) : 0;

      topicSummary.textContent = selectedTopics.length > 0
        ? `已選範圍：${selectedTopics.join("、")}`
        : "尚未選擇範圍";
      poolSummary.textContent = selectedQuestionCount
        ? `可抽題數：${availableQuestions.length} 題｜本次作答：${activeCount} 題`
        : `可抽題數：${availableQuestions.length} 題`;
      startButton.disabled = selectedTopics.length === 0 || !selectedQuestionCount || availableQuestions.length === 0;
      startButton.textContent = activeCount > 0 ? `開始作答 ${activeCount} 題` : "開始作答";
    }

    function updateProgressBar(value) {
      progressBar.style.width = `${Math.max(0, Math.min(100, value))}%`;
    }

    function startQuiz() {
      const selectedTopics = getSelectedTopics();
      const availableQuestions = questionBank.filter((question) => selectedTopics.includes(question.category));

      if (selectedTopics.length === 0) {
        startMessage.textContent = "請至少選擇一個範圍。";
        return;
      }

      if (!selectedQuestionCount) {
        startMessage.textContent = "請選擇本次作答題數。";
        return;
      }

      if (availableQuestions.length === 0) {
        startMessage.textContent = "目前選取範圍內尚無題目。";
        return;
      }

      startMessage.textContent = "";
      questions = shuffle(availableQuestions)
        .slice(0, Math.min(selectedQuestionCount, availableQuestions.length))
        .map(randomizeChoices);
      currentIndex = 0;
      score = 0;
      answers = [];

      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      renderQuestion();
    }

    function formatScore(correctCount) {
      if (questions.length === 0) {
        return "0";
      }

      const scoreValue = correctCount * (100 / questions.length);
      return Number.isInteger(scoreValue) ? String(scoreValue) : scoreValue.toFixed(1);
    }

    function renderQuestion() {
      const current = questions[currentIndex];

      if (!current) {
        questionNumber.textContent = "0";
        progressText.textContent = "沒有可用題目";
        scoreText.textContent = "目前得分：0 / 100";
        questionText.textContent = "找不到題庫";
        choices.innerHTML = "";
        feedback.textContent = "請確認 questions.js 已正確載入。";
        nextButton.disabled = true;
        updateProgressBar(0);
        return;
      }

      hasAnswered = false;
      questionNumber.textContent = currentIndex + 1;
      progressText.textContent = `第 ${currentIndex + 1} / ${questions.length} 題`;
      scoreText.textContent = `目前得分：${formatScore(score)} / 100`;
      questionText.textContent = current.text;
      feedback.textContent = "請選擇一個答案。";
      feedback.className = "feedback";
      nextButton.disabled = true;
      finishButton.disabled = false;
      nextButton.textContent = currentIndex === questions.length - 1 ? "看結果" : "下一題";
      updateProgressBar((currentIndex / questions.length) * 100);
      result.classList.remove("show");
      result.textContent = "";
      review.classList.remove("show");
      scoreCard.classList.remove("show");
      quizScreen.classList.remove("is-finished");
      confettiLayer.innerHTML = "";

      choices.innerHTML = "";
      current.choices.forEach((choice) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.dataset.key = choice.key;
        button.textContent = `${choice.key}. ${choice.text}`;
        button.addEventListener("click", () => checkAnswer(button, choice.key));
        choices.appendChild(button);
      });
    }

    function checkAnswer(selectedButton, selectedKey) {
      if (hasAnswered) {
        return;
      }

      const current = questions[currentIndex];
      const choiceButtons = Array.from(document.querySelectorAll(".choice"));

      hasAnswered = true;
      choiceButtons.forEach((button) => {
        button.disabled = true;

        if (button.dataset.key === current.answer) {
          button.classList.add("correct");
        }
      });

      if (selectedKey === current.answer) {
        score += 1;
        feedback.innerHTML = "";
        feedback.append("答對了！");
        feedback.classList.add("correct");
      } else {
        selectedButton.classList.add("wrong");
        selectedButton.classList.add("shake");
        selectedButton.addEventListener("animationend", () => selectedButton.classList.remove("shake"), { once: true });
        feedback.innerHTML = "";
        feedback.append(`答錯了，正確答案是 ${current.answer}。`);
        feedback.classList.add("wrong");
      }

      if (current.explanation) {
        const explanation = document.createElement("span");
        explanation.className = "explanation";
        explanation.textContent = `詳解：${current.explanation}`;
        feedback.appendChild(explanation);
      }

      answers[currentIndex] = {
        question: current.text,
        choices: current.choices,
        selectedAnswer: selectedKey,
        selectedText: (current.choices.find((choice) => choice.key === selectedKey) || {}).text || "",
        correctAnswer: current.answer,
        correctText: (current.choices.find((choice) => choice.key === current.answer) || {}).text || "",
        explanation: current.explanation,
        isCorrect: selectedKey === current.answer
      };

      scoreText.textContent = `目前得分：${formatScore(score)} / 100`;
      updateProgressBar(((currentIndex + 1) / questions.length) * 100);
      nextButton.disabled = false;
      nextButton.focus();
    }

    function createReviewItem(answer) {
      const item = document.createElement("li");
      item.className = `review-item ${answer.isCorrect ? "correct" : "wrong"}`;

      const title = document.createElement("strong");
      title.textContent = answer.question;

      const optionList = document.createElement("ul");
      optionList.className = "review-options";

      answer.choices.forEach((choice) => {
        const optionItem = document.createElement("li");
        optionItem.className = "review-option";
        optionItem.textContent = `${choice.key}. ${choice.text}`;

        if (choice.key === answer.selectedAnswer) {
          optionItem.classList.add("selected");
          optionItem.textContent += "（你的答案）";
        }

        if (choice.key === answer.correctAnswer) {
          optionItem.classList.add("correct");
          optionItem.textContent += "（正確答案）";
        }

        optionList.appendChild(optionItem);
      });

      item.append(title, optionList);

      if (answer.explanation) {
        const explanation = document.createElement("span");
        explanation.className = "review-explanation";
        explanation.textContent = `詳解：${answer.explanation}`;
        item.appendChild(explanation);
      }

      return item;
    }

    function showResult() {
      const wrongAnswers = answers.filter((answer) => !answer.isCorrect);

      questionText.textContent = "練習完成";
      choices.innerHTML = "";
      feedback.textContent = "你已完成所有題目。";
      feedback.className = "feedback";
      nextButton.disabled = true;
      finishButton.disabled = true;
      updateProgressBar(100);
      result.textContent = `總分：${formatScore(score)} / 100（答對 ${score} / ${answers.length} 題）`;
      // 舊版文字結果保留於 DOM 供相容，但改由成績卡呈現
      result.classList.remove("show");

      wrongList.innerHTML = "";

      if (wrongAnswers.length === 0) {
        wrongList.innerHTML = '<li class="empty-note">太棒了，這次沒有錯題。</li>';
      } else {
        wrongAnswers.forEach((answer) => wrongList.appendChild(createReviewItem(answer)));
      }

      review.classList.add("show");
      quizScreen.classList.add("is-finished");
      renderScoreCard();
    }

    function getTier(percent, total) {
      if (total > 0 && percent >= 100) {
        return { key: "gold", label: "滿分！全部答對 🏆" };
      }
      if (percent >= 80) {
        return { key: "green", label: "表現很棒 👍" };
      }
      if (percent >= 60) {
        return { key: "teal", label: "及格，再接再厲 🌱" };
      }
      if (percent >= 40) {
        return { key: "indigo", label: "快要抓到了 💪" };
      }
      return { key: "rose", label: "多複習幾次會更好 📖" };
    }

    function renderScoreCard() {
      const total = answers.length;
      const scoreValue = formatScore(score);
      const percent = total > 0 ? (score / total) * 100 : 0;
      const tier = getTier(percent, total);

      scoreCard.dataset.tier = tier.key;
      scoreTier.textContent = tier.label;
      scoreDetail.textContent = `答對 ${score}／${total} 題`;
      scoreRingValue.textContent = scoreValue;
      scoreCard.classList.add("show");

      // 圓環動畫：下一幀才設定百分比以觸發過渡
      scoreRing.style.setProperty("--pct", "0");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          scoreRing.style.setProperty("--pct", String(Math.max(0, Math.min(100, percent))));
        });
      });

      if (total > 0 && percent >= 100) {
        launchConfetti();
      }
    }

    function launchConfetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      const colors = ["#0f9d8f", "#5566e6", "#e0a306", "#0f9d63", "#e1466b"];
      const total = 90;
      confettiLayer.innerHTML = "";

      for (let i = 0; i < total; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDuration = `${2.2 + Math.random() * 1.8}s`;
        piece.style.animationDelay = `${Math.random() * 0.6}s`;
        piece.style.transform = `translateY(-20px) rotate(${Math.random() * 360}deg)`;
        if (Math.random() > 0.5) {
          piece.style.borderRadius = "50%";
        }
        confettiLayer.appendChild(piece);
      }

      window.setTimeout(() => {
        confettiLayer.innerHTML = "";
      }, 5000);
    }

    nextButton.addEventListener("click", () => {
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    });

    restartButton.addEventListener("click", () => {
      currentIndex = 0;
      score = 0;
      answers = [];
      questions = [];
      choices.innerHTML = "";
      updateProgressBar(0);
      result.classList.remove("show");
      review.classList.remove("show");
      scoreCard.classList.remove("show");
      quizScreen.classList.remove("is-finished");
      confettiLayer.innerHTML = "";
      finishButton.disabled = false;
      startMessage.textContent = "";
      updateStartControls();
      quizScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    topicOptions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-topic]");

      if (!button) {
        return;
      }

      button.classList.toggle("selected");
      startMessage.textContent = "";
      updateStartControls();
    });

    clearButton.addEventListener("click", () => {
      document.querySelectorAll("[data-topic].selected, [data-count].selected")
        .forEach((button) => button.classList.remove("selected"));
      selectedQuestionCount = null;
      startMessage.textContent = "";
      updateStartControls();
    });

    finishButton.addEventListener("click", () => {
      if (answers.length === 0) {
        feedback.textContent = "請至少完成一題後再提前結束。";
        feedback.className = "feedback wrong";
        return;
      }

      showResult();
    });

    countOptions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-count]");

      if (!button) {
        return;
      }

      document.querySelectorAll("[data-count].selected")
        .forEach((selectedButton) => selectedButton.classList.remove("selected"));
      button.classList.add("selected");
      selectedQuestionCount = Number(button.dataset.count);
      startMessage.textContent = "";
      updateStartControls();
    });

    startButton.addEventListener("click", startQuiz);

    // 「再來一輪」重用重新選擇題數的流程
    againButton.addEventListener("click", () => restartButton.click());

    // 回到頂部
    toTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("scroll", () => {
      if (window.scrollY > 320) {
        toTop.classList.add("show");
      } else {
        toTop.classList.remove("show");
      }
    }, { passive: true });

    // 鍵盤操作增強（不影響既有點擊邏輯）
    document.addEventListener("keydown", (event) => {
      if (quizScreen.classList.contains("hidden")) {
        return;
      }

      if (event.metaKey || event.ctrlKey || event.altKey) {
        return;
      }

      if (!hasAnswered) {
        const choiceButtons = Array.from(choices.querySelectorAll(".choice"));
        let index = -1;

        if (/^[1-9]$/.test(event.key)) {
          index = Number(event.key) - 1;
        } else if (/^[a-z]$/i.test(event.key)) {
          index = event.key.toUpperCase().charCodeAt(0) - 65;
        }

        if (index >= 0 && index < choiceButtons.length) {
          event.preventDefault();
          choiceButtons[index].click();
        }
        return;
      }

      if ((event.key === "Enter" || event.key === "ArrowRight") && !nextButton.disabled) {
        event.preventDefault();
        nextButton.click();
      }
    });

    updateStartControls();
  </script>
</body>
</html>
